<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#F6F4F0">
<meta name="description" content="전국 착한가게와 맛집, 여행코스를 내 위치 기준으로 찾는 무료 공익 서비스">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<script src="vendor/leaflet/leaflet.js" defer></script>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>착한맛자랑 — 전국 착한 맛집과 여행코스</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&family=Noto+Serif+KR:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F4F0;--surface:#FFFFFF;--ink:#16181D;--ink2:#3A3D45;--sub:#8A8D96;--line:#E9E6E0;
  --brand:#1F6F5C;--brand-soft:#E5F0EB;--warm:#E8613C;--warm-soft:#FCEBE4;--share:#6B4FBB;--share-soft:#EEEAF8;
  --yt:#E0352B;--blog:#12A150;--insta:#C2357E;
  --sh:0 1px 2px rgba(22,24,29,.04),0 8px 24px rgba(22,24,29,.06);
  --r:20px;--serif:'Noto Serif KR',serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:#E9E5DE}
body{font-family:'Noto Sans KR',system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
button,input,select,textarea{font-family:inherit;color:inherit}
button{border:0;background:none;cursor:pointer}
a{color:inherit}
.app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;padding-bottom:92px;overflow-x:hidden}
/* top bar */
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;padding:12px 18px;background:rgba(246,244,240,.88);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px)}
.mark{display:flex;align-items:center;gap:8px;font-weight:800;font-size:17px;letter-spacing:-.03em;white-space:nowrap;flex:none}
.mark svg{width:26px;height:26px}
.region-btn{margin-left:auto;display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);padding:7px 12px 7px 10px;border-radius:99px;font-size:13px;font-weight:700;max-width:58%;box-shadow:var(--sh)}
.region-btn span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.region-btn svg{flex:none;width:14px;height:14px;color:var(--brand)}
/* hero */
.hero{padding:10px 18px 4px}
.eyebrow{font-size:12px;font-weight:700;color:var(--brand);letter-spacing:.02em;display:flex;align-items:center;gap:6px}
.eyebrow i{width:6px;height:6px;border-radius:50%;background:var(--brand);display:inline-block;box-shadow:0 0 0 4px var(--brand-soft)}
.hero h1{font-family:var(--serif);font-weight:700;font-size:28px;line-height:1.3;margin-top:10px;letter-spacing:-.03em}
.hero h1 em{font-style:normal;color:var(--brand)}
.search{margin-top:16px;display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:16px;padding:0 14px;box-shadow:var(--sh);border:1px solid var(--line)}
.search svg{width:18px;height:18px;color:var(--sub);flex:none}
.search input{flex:1;border:0;outline:0;font-size:15px;padding:14px 0;background:none}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 18px 0}
.stat{background:var(--surface);border-radius:16px;padding:12px;border:1px solid var(--line)}
.stat b{display:block;font-size:20px;font-weight:800;letter-spacing:-.03em}
.stat span{font-size:11.5px;color:var(--sub)}
/* sections */
.sec{padding:26px 0 0}
.sec-h{display:flex;align-items:flex-end;justify-content:space-between;padding:0 18px 12px}
.sec-h h2{font-size:18px;font-weight:800;letter-spacing:-.03em}
.sec-h p{font-size:12px;color:var(--sub);margin-top:3px}
.sec-h .more{font-size:13px;color:var(--brand);font-weight:700}
.hscroll{display:flex;gap:12px;overflow-x:auto;padding:2px 18px 6px;scroll-snap-type:x mandatory;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.pad{padding:0 18px}
/* course card */
.ccard{flex:none;width:260px;scroll-snap-align:start;border-radius:var(--r);overflow:hidden;background:var(--surface);box-shadow:var(--sh);text-align:left;display:block}
.ccard.wide{width:100%}
.cover{height:132px;position:relative;color:#fff;padding:14px 16px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden}
.cover .big{position:absolute;right:-6px;top:-10px;font-size:92px;opacity:.95;filter:drop-shadow(0 6px 14px rgba(0,0,0,.25))}
.cover .tag{position:absolute;left:14px;top:12px;font-size:11px;font-weight:700;background:rgba(255,255,255,.18);backdrop-filter:blur(6px);padding:4px 9px;border-radius:99px}
.cover h3{font-family:var(--serif);font-size:19px;font-weight:700;line-height:1.3;position:relative;max-width:78%}
.cbody{padding:12px 16px 14px}
.cbody p{font-size:13px;color:var(--ink2)}
.cmeta{display:flex;gap:10px;margin-top:8px;font-size:12px;color:var(--sub)}
.cmeta b{color:var(--brand)}
/* mini store card */
.mcard{flex:none;width:152px;scroll-snap-align:start;background:var(--surface);border-radius:18px;overflow:hidden;box-shadow:var(--sh);text-align:left}
.mcard .ph{height:96px;display:grid;place-items:center;font-size:44px;position:relative}
.mcard .in{padding:10px 12px 12px}
.mcard .nm{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mcard .sm{font-size:12px;color:var(--sub);margin-top:2px}
/* list store */
.list{display:flex;flex-direction:column;gap:10px}
.store{width:100%;display:flex;gap:14px;text-align:left;background:var(--surface);border-radius:18px;padding:12px;box-shadow:var(--sh)}
.ph{border-radius:14px;display:grid;place-items:center;position:relative;flex:none}
.store .ph{width:76px;height:76px;font-size:36px}
.newb{position:absolute;top:6px;left:6px;background:var(--warm);color:#fff;font-size:9.5px;font-weight:800;padding:2px 6px;border-radius:6px;letter-spacing:.04em}
.si{flex:1;min-width:0}
.r1{display:flex;align-items:center;gap:6px}
.nm{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ds{margin-left:auto;font-size:12px;color:var(--sub);flex:none}
.mn{font-size:13px;color:var(--ink2);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mn b{font-weight:800;color:var(--ink)}
.srcline{display:flex;gap:8px;font-size:11.5px;margin-top:5px;color:var(--sub)}
.srcline i{font-style:normal;font-weight:700}
.bds{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
.bd{font-size:11px;font-weight:700;padding:3px 7px;border-radius:7px;line-height:1.2}
.bd.price{background:var(--brand-soft);color:var(--brand)}
.bd.share{background:var(--share-soft);color:var(--share)}
.bd.hot{background:var(--warm-soft);color:var(--warm)}
.bd.mine{background:#F0EEE9;color:var(--ink2)}
.bd.spon{background:#FFF3D9;color:#8A6200}
.bd.fit{background:#16181D;color:#fff}
.ask{margin-top:18px}
.ask h3{font-size:14px;font-weight:800;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.pur{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.pur button{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:9px 0 8px;font-size:11.5px;font-weight:700;color:var(--ink2);display:flex;flex-direction:column;align-items:center;gap:3px}
.pur button em{font-style:normal;font-size:20px;line-height:1}
.pur button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.fbtn{font-size:12.5px;font-weight:700;color:var(--brand);background:var(--brand-soft);padding:6px 11px;border-radius:99px}
.pills{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pill{font-size:12px;font-weight:700;background:var(--ink);color:#fff;padding:5px 10px;border-radius:99px}
.clear{font-size:12px;color:var(--sub);text-decoration:underline;padding:4px}
.fsec{margin-top:18px}
.fsec h4{font-size:14px;font-weight:800;margin-bottom:10px}
.fsec .kw{gap:6px}
.ctags{display:flex;gap:4px;margin-top:8px}
.ctags span{font-size:11px;font-weight:700;background:#F0EEE9;color:var(--ink2);padding:3px 8px;border-radius:7px}
/* chips */
.chips{display:flex;gap:6px;overflow-x:auto;padding:0 18px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:99px;background:var(--surface);border:1px solid var(--line);color:var(--ink2)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:700}
.chip.g.on{background:var(--brand);border-color:var(--brand)}
.seg{display:flex;background:#ECE8E1;border-radius:14px;padding:4px;margin:0 18px 14px}
.seg button{flex:1;font-size:13px;font-weight:700;padding:9px 0;border-radius:10px;color:var(--sub)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
/* map */
.map{margin:0 18px;height:250px;border-radius:var(--r);overflow:hidden;background:#EFEBE4;box-shadow:var(--sh);position:relative}
.map svg{width:100%;height:100%;display:block}
.map.real{height:320px}
.map{isolation:isolate;z-index:0}  /* Leaflet 내부 z-index(400~1000)가 시트·내비 위로 올라오지 않게 */
.map .leaflet-container{width:100%;height:100%;font-family:inherit;background:#EFEBE4}
.lpin{width:32px;height:32px;border-radius:50%;background:#fff;border:2.6px solid #E8613C;display:grid;place-items:center;font-size:16px;box-shadow:0 2px 6px rgba(0,0,0,.18);cursor:pointer}
.lme{width:18px;height:18px;border-radius:50%;background:#16181D;border:3.5px solid #fff;box-shadow:0 0 0 6px rgba(31,111,92,.18)}
.leaflet-control-attribution{font-size:10px!important;background:rgba(255,255,255,.8)!important}
.legend{display:flex;gap:12px;font-size:11.5px;color:var(--sub);padding:10px 18px 0}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:0}
.collect{margin:14px 18px 0;display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:16px;padding:12px 14px;border:1px solid var(--line)}
.pulse{width:9px;height:9px;border-radius:50%;background:var(--brand);box-shadow:0 0 0 4px var(--brand-soft);flex:none}
.collect b{font-size:13px}
.collect p{font-size:12px;color:var(--sub);margin-top:1px}
.empty{margin:0 18px;text-align:center;color:var(--sub);font-size:14px;padding:36px 16px;border-radius:var(--r);border:1.5px dashed var(--line);line-height:1.6}
/* nav */
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;z-index:40;padding:0 12px calc(10px + env(safe-area-inset-bottom))}
.navin{display:grid;grid-template-columns:repeat(5,1fr);background:rgba(255,255,255,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:22px;box-shadow:0 10px 30px rgba(22,24,29,.12);border:1px solid var(--line)}
nav button{padding:10px 0 9px;font-size:10.5px;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:3px;font-weight:500}
nav button svg{width:22px;height:22px}
nav button.on{color:var(--brand);font-weight:800}
/* sheets & pages */
.scrim{position:fixed;inset:0;background:rgba(15,16,20,.42);z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;transform:translate(-50%,100%);width:100%;max-width:480px;max-height:90vh;overflow:auto;background:var(--bg);border-radius:26px 26px 0 0;z-index:51;transition:transform .28s cubic-bezier(.2,.8,.2,1);padding:10px 18px 32px}
.sheet.open{transform:translate(-50%,0)}
.grab{width:38px;height:4px;border-radius:9px;background:#D6D1C8;margin:0 auto 14px}
.xbtn{position:absolute;top:12px;right:14px;width:36px;height:36px;border-radius:50%;background:#ECE8E1;font-size:15px;font-weight:700;color:var(--ink2);display:grid;place-items:center}
.xbtn:focus-visible,.back:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid #8FD3BC;outline-offset:2px}
.collect.samp{background:#FFF7E6;border-color:#F3DFB5}.collect.samp .pulse{background:#D99A1E;box-shadow:0 0 0 4px #FBE9C4}
.page{position:fixed;inset:0;left:50%;transform:translateX(-50%) translateX(100%);width:100%;max-width:480px;background:var(--bg);z-index:45;overflow:auto;transition:transform .3s cubic-bezier(.2,.8,.2,1);padding-bottom:0;scroll-padding-bottom:100px}
.page.open{transform:translateX(-50%)}
.pcover{height:250px;position:relative;color:#fff;padding:18px 18px 44px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden}
.pcover .big{position:absolute;right:-10px;top:30px;font-size:140px;filter:drop-shadow(0 10px 24px rgba(0,0,0,.25))}
.pcover h2{font-family:var(--serif);font-size:26px;line-height:1.3;position:relative;max-width:80%}
.pcover p{font-size:13px;opacity:.9;margin-top:6px;position:relative}
.back{position:absolute;top:14px;left:14px;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.22);backdrop-filter:blur(8px);display:grid;place-items:center;color:#fff;z-index:2}
.back svg{width:20px;height:20px}
.sumrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:-26px 18px 0;position:relative}
.sumrow div{background:var(--surface);border-radius:16px;padding:12px;box-shadow:var(--sh);text-align:center}
.sumrow b{display:block;font-size:17px;font-weight:800}
.sumrow span{font-size:11px;color:var(--sub)}
.route{margin:16px 18px 0;height:150px;border-radius:var(--r);overflow:hidden;background:#EFEBE4;box-shadow:var(--sh)}
.route svg{width:100%;height:100%;display:block}
.tl{padding:18px 18px 0;position:relative}
.step{display:grid;grid-template-columns:36px 1fr;gap:12px;position:relative}
.step .no{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:800;color:#fff;position:relative;z-index:1}
.step .bar{position:absolute;left:15px;top:34px;bottom:-6px;width:2px;background:var(--line)}
.step:last-child .bar{display:none}
.scard{background:var(--surface);border-radius:18px;padding:13px 14px;box-shadow:var(--sh);margin-bottom:6px}
.scard h4{font-size:15px;font-weight:800}
.scard p{font-size:12.5px;color:var(--sub);margin-top:3px}
.scard .act{display:flex;gap:8px;margin-top:10px}
.mini{font-size:12px;font-weight:700;padding:7px 11px;border-radius:10px;background:#F2EFEA;text-decoration:none;display:inline-flex;align-items:center;gap:4px}
.mini.g{background:var(--brand-soft);color:var(--brand)}
.move{font-size:12px;color:var(--sub);padding:2px 0 12px 48px;display:flex;align-items:center;gap:6px}
.pick{display:flex;gap:12px;align-items:center;margin-top:10px;padding:10px;border-radius:14px;background:var(--bg);text-align:left;width:100%}
.pick .ph{width:54px;height:54px;font-size:28px}
.bottombar{position:sticky;bottom:0;width:100%;margin-top:16px;padding:12px 18px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 30%);display:flex;gap:8px;z-index:46;pointer-events:none}
.bottombar>*{pointer-events:auto}
.btn{flex:1;font-size:15px;font-weight:800;padding:15px;border-radius:16px;background:var(--ink);color:#fff;text-align:center;text-decoration:none;display:block}
.btn.brand{background:var(--brand)}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.sm{flex:none;padding:15px 16px}
/* detail */
.dhead{display:flex;gap:14px;align-items:center}
.dhead .ph{width:84px;height:84px;font-size:42px}
.dhead h3{font-size:21px;font-weight:800;letter-spacing:-.03em}
.save3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0 4px}
.save3 button{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:11px 4px;font-size:13px;font-weight:700}
.save3 button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.box{background:var(--surface);border-radius:18px;padding:14px;margin-top:10px;box-shadow:var(--sh)}
.box h4{font-size:14px;font-weight:800;margin-bottom:8px}
.kw{display:flex;flex-wrap:wrap;gap:6px}
.kw span{font-size:12px;font-weight:500;background:var(--brand-soft);color:var(--brand);padding:4px 10px;border-radius:99px}
.men{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:13px;align-items:baseline}
.men:first-of-type{border-top:0}
.men .s{font-size:11px;font-weight:800;flex:none;width:40px}
.men .t{flex:1;line-height:1.45}
.men .t a{text-decoration:none}
.men .a{font-size:11px;color:var(--sub);flex:none}
.note{font-size:12px;color:var(--sub);line-height:1.55;margin-top:8px}
input[type=text],textarea,select{width:100%;font-size:14px;border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--surface);outline:none}
textarea{resize:vertical}
/* region sheet */
.sgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.sgrid button{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:11px 4px;font-size:14px;font-weight:700}
.sgrid button small{display:block;font-size:10.5px;color:var(--sub);font-weight:500;margin-top:2px}
.sgrid button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.sgrid button.on small{color:#C9CBD1}
.alist{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.alist button{display:flex;justify-content:space-between;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;font-size:15px;font-weight:700;text-align:left}
.alist button.on{border-color:var(--brand);color:var(--brand);background:var(--brand-soft)}
.h3{font-size:18px;font-weight:800;margin-bottom:14px;letter-spacing:-.03em}
/* brag */
.drop{display:block;border:1.5px dashed #CFC8BC;border-radius:var(--r);padding:26px;text-align:center;color:var(--sub);font-size:14px;background:var(--surface);cursor:pointer;margin:0 18px}
.drop img{max-width:100%;border-radius:14px;display:block;margin:0 auto}
.drop b{display:block;font-size:15px;color:var(--ink);margin-bottom:4px}
.out img{width:100%;border-radius:var(--r);margin-top:12px;box-shadow:var(--sh)}
.foot{margin:34px 18px 0;padding:18px;border-radius:var(--r);background:#EFEBE4;font-size:12.5px;color:var(--ink2);line-height:1.7}
.foot b{display:block;font-size:13.5px;margin-bottom:6px;color:var(--ink)}
.toast{position:fixed;left:50%;bottom:104px;transform:translate(-50%,10px);background:var(--ink);color:#fff;font-size:13px;font-weight:500;padding:11px 18px;border-radius:99px;z-index:70;opacity:0;transition:all .2s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
.skel{height:80px;border-radius:18px;background:linear-gradient(90deg,#EEEAE3,#F6F3EE,#EEEAE3);background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="top">
    <a class="mark" href="./" style="text-decoration:none;color:inherit" aria-label="착한맛자랑 소개"><svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="10" fill="#1F6F5C"/><path d="M10 22c0-7 5-12 13-12-1 8-6 12-13 12z" fill="#fff"/><path d="M10 22l7-7" stroke="#1F6F5C" stroke-width="1.6" stroke-linecap="round"/></svg>착한맛자랑</a>
    <button class="region-btn" id="regionBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.3"/></svg><span id="regionLabel">불러오는 중</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg></button>
  </div>
  <main id="view"><div class="pad" style="padding-top:20px"><div class="skel"></div></div></main>

function classify(s){
  if(s._t)return s;

  const has=re=>re.test(txt);

  if(/맵/.test(kw))T.add('매운맛');
  const cafe=T.has('카페·디저트'),snack=T.has('분식'),meat=T.has('고기'),sea=T.has('해산물');
  const P=new Set();
  if(/데이트|분위기|기념일/.test(kw)||((T.has('양식')||T.has('일식')||cafe)&&(!p||p>=6000)))P.add('date');
  if(/단체|모임|술/.test(kw)||meat||sea||T.has('중식')||/찌개|막창|술집/.test(txt))P.add('friends');

  if(/부모님|효도|친절|깔끔|노포|집밥|주차|조용/.test(kw)&&!/버거|타코|멕시칸/.test(txt)&&!snack)P.add('parents');
  if((T.has('한식')||T.has('국밥·탕'))&&/백반|국밥|생선|삼계|비빔밥|쌈밥|떡갈비|순두부|칼국수/.test(txt))P.add('parents');
  if(/혼밥/.test(kw)||((snack||T.has('국밥·탕')||T.has('면')||/덮밥|버거|도시락|김밥/.test(txt))&&(!p||p<=11000)))P.add('solo');

  s._t=T;s._p=P;return s;
}

const HOME_R=3000;

  const c=area(),q=S.q.trim();

    .sort((a,b)=>(!!b.good-!!a.good)||a.d-b.d);

  return S.wide?{found:all,more:0}:{found:inR,more:all.length-inR.length};

function nearby(){

}

let LMAP=null;S.mapFail=false;
function realMap(arr){

  dropMap();
  const c=area(),svgFallback=box.innerHTML;
  box.innerHTML='<div id="lmap" style="width:100%;height:100%"></div>';box.classList.add('real');
  const m=L.map('lmap',{zoomControl:false,attributionControl:true,zoomAnimation:false,fadeAnimation:false,markerZoomAnimation:false}).setView([c.lat,c.lng],15,{animate:false});
  let ok=0,bad=0;
  L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',{subdomains:'abcd',maxZoom:19,
    attribution:'© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> © <a href="https://carto.com/attributions" target="_blank" rel="noopener">CARTO</a>'})
    .on('tileload',()=>ok++).on('tileerror',()=>{if(++bad>=6&&!ok){S.mapFail=true;dropMap();box.classList.remove('real');box.innerHTML=svgFallback}}).addTo(m);
  const ring=L.circle([c.lat,c.lng],{radius:S.radius,color:'#1F6F5C',weight:1.5,opacity:.6,fillColor:'#1F6F5C',fillOpacity:.05,dashArray:'5 5'}).addTo(m);

  arr.forEach(s=>{const col=s.good?GOOD[s.good].c:'#E8613C';
    L.marker([s.lat,s.lng],{title:s.name,alt:s.name,icon:L.divIcon({className:'',html:`<div class="lpin" style="border-color:${col}">${s.emoji}</div>`,iconSize:[32,32],iconAnchor:[16,16]})})
      .on('click',()=>storeSheet(s.id,s.sido)).addTo(m)});
  m.fitBounds(ring.getBounds(),{padding:[12,12],animate:false});

function mapSvg(arr){
  const W=440,H=250,cx=W/2,cy=H/2,c=area(),sc=(H/2-20)/S.radius;
  let st='';for(let x=-W;x<W*2;x+=62)st+=`<line x1="${x}" y1="0" x2="${x+70}" y2="${H}" stroke="#E4DED4" stroke-width="8"/>`;
  for(let y=18;y<H;y+=52)st+=`<line x1="0" y1="${y}" x2="${W}" y2="${y+10}" stroke="#E4DED4" stroke-width="5"/>`;
  const pins=arr.slice().reverse().map(s=>{const dx=(s.lng-c.lng)*111320*Math.cos(c.lat*Math.PI/180),dy=(s.lat-c.lat)*111320;
    const x=cx+dx*sc,y=cy-dy*sc,col=s.good?GOOD[s.good].c:'#E8613C';
    return `<g data-store="${s.id}" data-sido="${s.sido}" style="cursor:pointer"><circle cx="${x}" cy="${y+2}" r="15" fill="rgba(0,0,0,.08)"/><circle cx="${x}" cy="${y}" r="15" fill="#fff" stroke="${col}" stroke-width="2.6"/><text x="${x}" y="${y+5.5}" text-anchor="middle" font-size="15">${s.emoji}</text></g>`}).join('');
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid slice" role="img" aria-label="주변 맛집 지도"><rect width="${W}" height="${H}" fill="#EFEBE4"/>${st}
  <circle cx="${cx}" cy="${cy}" r="${H/2-20}" fill="rgba(31,111,92,.06)" stroke="#1F6F5C" stroke-opacity=".5" stroke-dasharray="5 5"/>${pins}
  <circle cx="${cx}" cy="${cy}" r="9" fill="#16181D" stroke="#fff" stroke-width="3.5"/></svg>`;
}

const courseCand={};  // 'courseId:슬롯번호' → 후보 가게 id 목록 (교체 순서)
async function openCourse(id){
  const c=IDX.courses.find(x=>x.id===id),arr=await loadSido(c.sido),st=courseStats(c);
  const meals=c.stops.map((s,i)=>{if(s.t!=='meal')return null;
    let cand=arr.map(x=>({...x,d:dist(s,x)})).filter(x=>x.d<=900);
    const CAFE=/카페|디저트|베이커리|제과|아이스크림|젤라또|빙수|커피|차$|떡,한과/;
    if(s.pref==='cafe'){const cf=cand.filter(x=>CAFE.test(x.cat));if(cf.length)cand=cf}
    else{const meal=cand.filter(x=>!CAFE.test(x.cat)&&!CAFE.test(x.name));if(meal.length)cand=meal}  // 식사 슬롯엔 카페·디저트 제외
    if(fActive()){const fit=cand.filter(x=>passF(x));if(fit.length){cand=fit;cand.fit=true}}
    cand.sort((a,b)=>(!!b.good-!!a.good)||(b.buzz-a.buzz));return cand});
  const pickOf=i=>{const cand=meals[i]||[],k=c.id+':'+i;courseCand[k]=cand.map(x=>x.id);
    const j=cand.findIndex(x=>x.id===S.picks[k]);return j<0?0:j};
  // 한 코스 안에서 같은 가게가 두 번 추천되지 않게: 저장된 선택 우선, 아니면 아직 안 쓴 후보 중 첫 번째
  const used=new Set(),picked=c.stops.map((s,i)=>{const cand=meals[i];if(s.t!=='meal'||!cand||!cand.length)return null;
    let p=cand[pickOf(i)];if(!S.picks[c.id+':'+i]&&used.has(p.id))p=cand.find(x=>!used.has(x.id))||p;used.add(p.id);return p});
  const goodPicked=picked.filter(p=>p&&p.good).length;
  const pts=c.stops,lats=pts.map(p=>p.lat),lngs=pts.map(p=>p.lng);
  const mnLa=Math.min(...lats),mxLa=Math.max(...lats),mnLo=Math.min(...lngs),mxLo=Math.max(...lngs);
  const W=440,H=150,pad=28,mLa=(mnLa+mxLa)/2,mLo=(mnLo+mxLo)/2,cs=Math.cos(mLa*Math.PI/180);
  const k=Math.min((W-pad*2)/Math.max((mxLo-mnLo)*cs,1e-5),(H-pad*2)/Math.max(mxLa-mnLa,1e-5));
  const P=pts.map(p=>[+(W/2+(p.lng-mLo)*cs*k).toFixed(1),+(H/2-(p.lat-mLa)*k).toFixed(1)]);
  const routeSvg=`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet"><rect width="${W}" height="${H}" fill="#EFEBE4"/><polyline points="${P.map(p=>p.join(',')).join(' ')}" fill="none" stroke="${c.tone}" stroke-width="3" stroke-dasharray="1 7" stroke-linecap="round"/>${P.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="12" fill="${pts[i].t==='meal'?'#1F6F5C':c.tone}" stroke="#fff" stroke-width="3"/><text x="${p[0]}" y="${p[1]+4.5}" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">${i+1}</text>`).join('')}</svg>`;
  const steps=c.stops.map((s,i)=>{
    const mv=i?`<div class="move">${svg(s.move==='bus'?'bus':'walk',15)} ${s.move==='bus'?'버스·택시':'도보'} 약 ${moveMin(dist(c.stops[i-1],s),s.move)}분 · ${fD(dist(c.stops[i-1],s))}</div>`:'';
    let body;
    if(s.t==='meal'){const cand=meals[i]||[],p=picked[i],j=Math.max(0,cand.findIndex(x=>p&&x.id===p.id));
      body=`<div class="scard"><h4>${s.pref==='cafe'?'☕':'🍽️'} ${esc(s.name)}</h4><p>머무는 시간 ${s.stay}분 · 근처 900m 안 ${cand.length}곳 중 추천${cand.fit?' · <b style="color:var(--brand)">맞춤 조건 반영</b>':''}</p>
      ${p?`<button class="pick" data-store="${p.id}" data-sido="${c.sido}"><div class="ph" style="background:${p.bg}">${p.emoji}</div><div class="si"><div class="nm">${esc(p.name)}</div><div class="mn">${p.price?`${esc(p.menu)} <b>${won(p.price)}</b>`:esc(p.cat)}</div><div class="bds">${p.good?`<span class="bd ${GOOD[p.good].cls}">${GOOD[p.good].label}</span>`:''}</div></div></button>
      ${cand.length>1?`<div class="act"><button class="mini g" data-swap="${c.id}:${i}">↻ 다른 가게 (${j+1}/${cand.length})</button></div>`:''}`:'<p class="note">근처 등록 가게가 아직 없어요</p>'}</div>`}
    else body=`<div class="scard"><h4>${esc(s.name)}</h4><p>${s.desc?esc(s.desc)+' · ':''}머무는 시간 ${s.stay}분</p><div class="act"><a class="mini" href="${kmap(s.name)}" target="_blank" rel="noopener">지도 ↗</a></div></div>`;
    return mv+`<div class="step"><span class="no" style="background:${s.t==='meal'?'#1F6F5C':c.tone}">${i+1}</span><span class="bar"></span>${body}</div>`;
  }).join('');
  const savedC=S.courses.includes(c.id);
  $('#page').innerHTML=`<div class="pcover" style="background:linear-gradient(150deg,${c.tone},${c.tone}d0 55%,${c.tone}90)"><button class="back" data-closepage aria-label="뒤로">${svg('back',20)}</button><span class="big">${c.emoji}</span><p style="font-weight:700">${IDX.regions[c.sido].name} 착한 여행코스</p><h2>${esc(c.title)}</h2><p>${esc(c.sub)}</p></div>
  <div class="sumrow"><div><b>${fT(st.t)}</b><span>예상 소요</span></div><div><b>${fD(st.m)}</b><span>총 이동거리</span></div><div><b>${goodPicked}/${st.slots}곳</b><span>추천 중 착한가게</span></div></div>
  <div class="route">${routeSvg}</div><div class="tl">${steps}</div>
  <p class="note" style="margin:6px 18px 0">관광지 좌표는 근사값이에요. 이동 시간은 직선거리로 계산한 예상치예요.</p>
  <div class="pad out" id="cout"></div>
  <div class="bottombar"><button class="btn ghost sm" data-savecourse="${c.id}">${savedC?'★ 저장됨':'☆ 저장'}</button><button class="btn brand" data-sharecourse="${c.id}">코스 공유 카드</button></div>`;

  if(!was)setTimeout(()=>pg.querySelector('.back')?.focus({preventScroll:true}),30);
}

function wrapText(x,t,X,Y,w,lh,max){let line='',n=0;for(const ch of t){if(x.measureText(line+ch).width>w){x.fillText(line,X,Y);Y+=lh;line=ch;if(++n>=max-1)break}else line+=ch}x.fillText(line,X,Y)}
function cardImg(draw,target,text){
  const cv=document.createElement('canvas');cv.width=1080;cv.height=1350;const x=cv.getContext('2d');
  Promise.resolve(draw(x)).then(()=>{const u=cv.toDataURL('image/jpeg',.9);
    target.innerHTML=`<img src="${u}" alt="공유 카드">${NATIVE&&PL.Share?'<button class="btn brand" id="nshare" style="width:100%;margin-top:10px">이미지 공유하기</button>':'<p class="note">이미지를 길게 눌러 저장해 인스타·카톡에 올려 주세요.</p>'}<button class="btn ghost" id="cpy" style="width:100%;margin-top:8px">공유 문구 복사</button>`;
    $('#nshare')?.addEventListener('click',async()=>{try{
      const f=await PL.Filesystem.writeFile({path:`goodplate-${Date.now()}.jpg`,data:u.split(',')[1],directory:'CACHE'});
      await PL.Share.share({title:'착한맛자랑',text,files:[f.uri],dialogTitle:'공유하기'})}catch(e){if(!/cancel/i.test(String(e)))toast('공유하지 못했어요')}});
    $('#cpy').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(text);toast('복사했어요')}catch(e){toast('복사가 막혀 있어요')}});
    target.scrollIntoView({behavior:'smooth',block:'start'})});
}

    const tags=draft.reasons.map(r=>'#'+r.replace(/\s/g,'')).join(' ');
    cardImg(x=>new Promise(res=>{
      const fin=img=>{x.fillStyle='#F6F4F0';x.fillRect(0,0,1080,1350);
        if(img){const k=Math.max(1080/img.width,780/img.height);x.save();x.beginPath();x.rect(0,0,1080,780);x.clip();x.drawImage(img,(1080-img.width*k)/2,(780-img.height*k)/2,img.width*k,img.height*k);x.restore()}
        else{x.fillStyle=s.bg;x.fillRect(0,0,1080,780);x.font='320px sans-serif';x.textAlign='center';x.fillText(s.emoji,540,520);x.textAlign='left'}
        if(s.good){x.fillStyle=GOOD[s.good].c;x.beginPath();x.roundRect(72,830,GOOD[s.good].label.length*34+48,58,29);x.fill();x.fillStyle='#fff';x.font='700 32px "Noto Sans KR"';x.fillText(GOOD[s.good].label,96,870)}
        x.fillStyle='#16181D';x.font='700 78px "Noto Serif KR"';x.fillText(s.name,72,s.good?990:950);
        x.fillStyle='#3A3D45';x.font='500 36px "Noto Sans KR"';x.fillText(`${s.price?s.menu+' '+won(s.price)+' · ':''}${IDX.regions[s.sido].name} ${IDX.regions[s.sido].areas[s.area]?.name||''}`,72,s.good?1050:1010);
        x.fillStyle='#E8613C';x.font='700 36px "Noto Sans KR"';x.fillText(tags,72,s.good?1118:1078);
        x.fillStyle='#16181D';x.font='400 34px "Noto Sans KR"';if(draft.text.trim())wrapText(x,'“'+draft.text.trim()+'”',72,s.good?1180:1140,936,48,2);
        brandFoot(x);res()};
      if(draft.photo){const im=new Image();im.onload=()=>fin(im);im.src=draft.photo}else fin(null)}),
      $('#out'),`[착한맛자랑] ${s.name}${s.price?` · ${s.menu} ${won(s.price)}`:''}\n${tags}\n${draft.text.trim()}`);
    S.brags.push({name:s.name,emoji:s.emoji,reasons:[...draft.reasons],text:draft.text.trim()});
    if(!S.saved[s.id])S.saved[s.id]={list:'been',snap:snap(s)};
    persist();toast('뽐내기 완료 · 응원 배지 +1');const bn=$('#bragN');if(bn)bn.textContent=S.brags.length;
  });
}
function shareCourse(id){
  const c=IDX.courses.find(x=>x.id===id),arr=CACHE[c.sido]||[];
  const names=c.stops.map((s,i)=>{if(s.t!=='meal')return s.name;const el=document.querySelector(`[data-swap="${c.id}:${i}"]`)?.closest('.scard')?.querySelector('.pick .nm');const p=el?el.textContent:'';return `${s.name.split('·')[0].trim()} · ${p||'근처 착한가게'}`});
  cardImg(x=>{x.fillStyle='#F6F4F0';x.fillRect(0,0,1080,1350);
    const g=x.createLinearGradient(0,0,1080,520);g.addColorStop(0,c.tone);g.addColorStop(1,c.tone+'b0');x.fillStyle=g;x.fillRect(0,0,1080,520);
    x.font='260px sans-serif';x.fillText(c.emoji,700,330);
    x.fillStyle='#fff';x.font='700 34px "Noto Sans KR"';x.fillText(IDX.regions[c.sido].name+' 착한 여행코스',72,330);
    x.font='700 70px "Noto Serif KR"';wrapText(x,c.title,72,420,900,84,2);
    names.forEach((n,i)=>{const y=620+i*104;x.fillStyle=c.stops[i].t==='meal'?'#1F6F5C':c.tone;x.beginPath();x.arc(104,y-14,30,0,7);x.fill();
      x.fillStyle='#fff';x.font='800 30px "Noto Sans KR"';x.textAlign='center';x.fillText(i+1,104,y-3);x.textAlign='left';
      x.fillStyle='#16181D';x.font=(c.stops[i].t==='meal'?'700':'500')+' 38px "Noto Sans KR"';x.fillText(n,160,y)});
    brandFoot(x)},$('#cout'),`[착한맛자랑 여행코스] ${c.title}\n${names.map((n,i)=>`${i+1}. ${n}`).join('\n')}`);
}
const snap=s=>({name:s.name,emoji:s.emoji,cat:s.cat,menu:s.menu,price:s.price,lat:s.lat,lng:s.lng,good:s.good,sido:s.sido,bg:s.bg,addr:s.addr,place_url:s.place_url,src:s.src});

/* ============ 이벤트 ============ */
document.addEventListener('click',async e=>{
  const t=e.target.closest('[data-closesheet],[data-wide],[data-gps],[data-pur],[data-fopen],[data-fbud],[data-ftaste],[data-fapply],[data-fclear],[data-cpur],[data-tab],[data-good],[data-radius],[data-sort],[data-scope],[data-ltab],[data-reason],[data-pick],[data-area],[data-save],[data-gobrag],[data-course],[data-closepage],[data-swap],[data-savecourse],[data-sharecourse],[data-store]');
  if(!t)return;const d=t.dataset;
  if(d.tab){S.tab=d.tab;closePage();closeSheet();render();scrollTo(0,0)}
  else if('good' in d){S.goodOnly=!S.goodOnly;render()}
  else if(d.radius){S.radius=+d.radius;persist();render()}
  else if(d.sort){S.sort=d.sort;render()}
  else if(d.scope){S.courseScope=d.scope;render()}
  else if(d.ltab){S.listTab=d.ltab;render()}
  else if(d.reason){const i=draft.reasons.indexOf(d.reason);i<0?draft.reasons.push(d.reason):draft.reasons.splice(i,1);t.classList.toggle('on')}
  else if(d.pick){regionPick=d.pick;regionSheet()}
  else if(d.area){S.useGps=false;S.sido=d.asido;S.area=d.area;regionPick=null;S.stores=await loadSido(S.sido);draft.storeId=null;persist();closeSheet();render();scrollTo(0,0);toast(`${IDX.regions[S.sido].name} ${area().name}(으)로 바꿨어요`)}
  else if(d.save){const arr=await loadSido(d.ssido),s=arr.find(x=>x.id===d.sid)||{...S.saved[d.sid]?.snap,id:d.sid};
    if(S.saved[d.sid]?.list===d.save){delete S.saved[d.sid];toast('리스트에서 뺐어요')}else{S.saved[d.sid]={list:d.save,snap:snap(s)};toast(`「${LIST[d.save]}」에 담았어요`)}
    persist();document.querySelectorAll('[data-save]').forEach(b=>b.classList.toggle('on',S.saved[d.sid]?.list===b.dataset.save));render()}
  else if(d.gobrag){if(d.bsido!==S.sido){S.sido=d.bsido;const s=(await loadSido(S.sido)).find(x=>x.id===d.gobrag);const ar=Object.entries(IDX.regions[S.sido].areas).sort((a,b)=>dist(a[1],s)-dist(b[1],s))[0][0];S.area=ar;S.stores=await loadSido(S.sido)}
    draft={photo:null,storeId:d.gobrag,reasons:[],text:''};closeSheet();closePage();S.tab='brag';render();scrollTo(0,0)}
  else if(d.course){closeSheet();await openCourse(d.course)}
  else if('closepage' in d)closePage();
  else if(d.swap){const ids=courseCand[d.swap]||[];if(ids.length){const shown=document.querySelector(`[data-swap="${d.swap}"]`)?.closest('.scard')?.querySelector('.pick')?.dataset.store;const cur=ids.indexOf(S.picks[d.swap]||shown);S.picks[d.swap]=ids[(Math.max(cur,0)+1)%ids.length];persist()}const y=$('#page').scrollTop;await openCourse(d.swap.split(':')[0]);$('#page').scrollTop=y}
  else if(d.savecourse){const i=S.courses.indexOf(d.savecourse);i<0?S.courses.push(d.savecourse):S.courses.splice(i,1);persist();t.textContent=i<0?'★ 저장됨':'☆ 저장';toast(i<0?'코스를 저장했어요':'저장을 취소했어요')}
  else if(d.sharecourse)shareCourse(d.sharecourse);
  else if('closesheet' in d)closeSheet();
  else if('wide' in d){S.wide=!S.wide;render()}
  else if('gps' in d){toast('위치를 확인하는 중…');await locate(false)}
  else if(d.pur){S.f.purpose=S.f.purpose===d.pur?null:d.pur;persist();if($('#sheet').classList.contains('open'))filterSheet();render()}
  else if('fopen' in d)filterSheet();
  else if(d.fbud){S.f.budget=S.f.budget===d.fbud?null:d.fbud;persist();filterSheet();render()}
  else if(d.ftaste){const i=S.f.tastes.indexOf(d.ftaste);i<0?S.f.tastes.push(d.ftaste):S.f.tastes.splice(i,1);persist();filterSheet();render()}
  else if('fapply' in d){closeSheet();if(S.tab!=='map'&&S.tab!=='home')S.tab='home';render();scrollTo(0,0)}
  else if('fclear' in d){S.f={purpose:null,budget:null,tastes:[]};persist();if($('#sheet').classList.contains('open'))filterSheet();render()}
  else if(d.cpur!==undefined){S.coursePur=d.cpur||null;render()}
  else if(d.store)storeSheet(d.store,d.sido);
});
$('#scrim').addEventListener('click',()=>{closeSheet();closePage()});
$('#regionBtn').addEventListener('click',()=>{regionPick=null;regionSheet()});

/* 해시 라우팅: #map · #course · #list · #brag · #course-<코스id> · #near(내 위치) */
async function route(){
  const h=location.hash.slice(1);
  if(h.startsWith('course-')){const c=IDX.courses.find(x=>x.id===h.slice(7));S.tab='course';render();if(c)await openCourse(c.id);return}
  if(['map','course','list','brag','home'].includes(h))S.tab=h;
  render();
  if(h==='near')locate(false);
}
(async function boot(){
  await loadIndex();
  if(!IDX.regions[S.sido]||!IDX.regions[S.sido].areas[S.area]){S.sido='seoul';S.area='jongno-jonggak'}
  S.stores=await loadSido(S.sido);
  route();addEventListener('hashchange',route);
  if(NATIVE){document.documentElement.classList.add('native');try{PL.StatusBar?.setStyle({style:'LIGHT'});PL.StatusBar?.setBackgroundColor?.({color:'#F6F4F0'});PL.SplashScreen?.hide()}catch(e){}}
  if(S.useGps)locate(true);
  // PWA: GitHub Pages 등 https 배포에서만 오프라인 캐시 사용 (미리보기 화면에선 조용히 건너뜀)
  try{if(!NATIVE&&'serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
})();
</script>
