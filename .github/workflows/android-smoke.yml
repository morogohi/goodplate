# 안드로이드 에뮬레이터 자동 점검 — 실기기 대신 APK를 설치·실행해 화면을 찍고, 앱이 죽지 않는지·딥링크가 열리는지 확인
# 결과 화면은 Actions 실행 결과의 Artifacts(android-smoke-shots)에서 볼 수 있음
name: android-smoke
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["app.html", "android/**", "capacitor.config.json", "package.json", ".github/workflows/android-smoke.yml"]
permissions: { contents: write }
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npm run build && npx cap sync android
      - name: 디버그 APK 빌드
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: KVM 사용 설정
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: 에뮬레이터에서 설치·실행·딥링크 점검
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash scripts/android_smoke.sh android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-smoke-shots
          path: smoke/
          retention-days: 14
      - name: 결과 화면을 smoke-results 브랜치에 저장 (최신 1회분만)
        if: always()
        run: |
          [ -d smoke ] || exit 0
          cd smoke && git init -q && git checkout -q -b smoke-results
          git config user.name goodplate-bot; git config user.email goodplate-bot@users.noreply.github.com
          git add -A && git commit -qm "smoke ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" smoke-results
