# 휴대폰 실기기 테스트용 Android APK (서명 없는 디버그 빌드) — Actions 실행 결과의 Artifacts 에서 내려받아 설치
name: android-apk
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["app.html", "data/**", "android/**", "capacitor.config.json", "package.json"]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npm run build && npx cap sync android
      - name: 디버그 APK 빌드
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: goodplate-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
